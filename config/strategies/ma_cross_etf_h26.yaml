# 双均线(EMA 20/60 金叉死叉)混合 26 池实例 —— 与 turtle_s1_etf_hybrid26
# 同篮子、同定仓预算(同时持仓 10 只:cap=1/10、x_risk=(0.35/8)/10),
# 用作"指标平滑 vs 价格突破"的策略族对照基准。
name: ma_cross_etf_h26
strategy: ma_cross
sec_type: etf
universe: ["510300", "159915", "512010", "510420", "159995", "512660", "512690", "513050", "512400", "515220", "510900", "513500", "159941", "513030", "518880", "159980", "159985", "511010", "515100", "159962", "159518", "511090", "513130", "513520", "159611", "513120"]
lookback: 750          # 信号重放窗口(根)
params:
  fast: 20             # 快线 EMA span(日)
  slow: 60             # 慢线 EMA span(日)
  atr_n: 20            # ATR 窗口(日,仅用于定仓)
  atr_m: 3.0           # 初始止损幅度倍数 stop_frac = atr_m×ATR/价格
  x_risk: 0.004375     # 组合级每笔风险 = (DD_tol/n)/预算持仓数 = (0.35/8)/10
  cap: 0.10            # 单标的权重上限 = 1/10
